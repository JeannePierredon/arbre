<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arbre Généalogique Familial</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Arbre Généalogique Familial</h1>
    <p>Cliquez sur une personne pour voir sa biographie</p>
  </header>

  <main id="tree-container">
    <!-- L'arbre sera généré dynamiquement ici -->
  </main>

  <!-- Fenêtre modale pour afficher la bio -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close-btn">&times;</span>
      <img id="modal-photo" src="" alt="Photo de profil">
      <h2 id="modal-nom"></h2>
      <p id="modal-bio"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
