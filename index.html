<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arbre Généalogique Familial</title>
  <style>
    :root {
      --primary: #2c3e50;
      --secondary: #3498db;
      --accent: #e74c3c;
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-main: #333333;
      --text-muted: #666666;
      --border-color: #e0e0e0;
      --highlight-bg: #ebf5fb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      color: var(--primary);
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-muted);
    }

    /* Barre de recherche */
    .search-bar {
      max-width: 400px;
      margin: 15px auto 0;
      display: flex;
    }

    .search-bar input {
      width: 100%;
      padding: 10px 15px;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      outline: none;
      font-size: 14px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    /* Bouton de retour */
    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1000px;
      margin: 0 auto 20px;
    }

    .btn-back {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .btn-back:hover {
      background-color: #1a252f;
    }

    /* Vues */
    .view-section {
      display: none;
      max-width: 1100px;
      margin: 0 auto;
    }

    .view-section.active {
      display: block;
    }

    /* Galerie d'accueil */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      padding: 10px;
    }

    .person-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      position: relative;
    }

    .person-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 18px rgba(0,0,0,0.12);
      border-color: var(--secondary);
    }

    .person-card.focus {
      border-color: var(--secondary);
      background-color: var(--highlight-bg);
      box-shadow: 0 0 15px rgba(52, 152, 219, 0.3);
    }

    .avatar-container {
      width: 80px;
      height: 80px;
      margin: 0 auto 12px;
      border-radius: 50%;
      overflow: hidden;
      background-color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .avatar-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .person-card h3 {
      font-size: 15px;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .person-card p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .badge-relation {
      display: inline-block;
      font-size: 10px;
      text-transform: uppercase;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 10px;
      background: #e0e0e0;
      color: #555;
      margin-bottom: 6px;
    }

    /* Section Arbre Dynamique */
    .tree-tree-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 35px;
      position: relative;
    }

    .tree-level {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .tree-level-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      position: relative;
    }

    .tree-cards-group {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    /* Modal Biographie */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: white;
      border-radius: 12px;
      padding: 25px;
      max-width: 450px;
      width: 90%;
      position: relative;
      text-align: center;
    }

    .close-modal {
      position: absolute;
      top: 15px;
      right: 15px;
      font-size: 20px;
      cursor: pointer;
      color: #888;
    }

    .modal-bio {
      margin-top: 15px;
      text-align: left;
      font-size: 14px;
      line-height: 1.5;
      background: #f8f9fa;
      padding: 12px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Arbre Généalogique Familial</h1>
    <p>Cliquez sur une personne pour afficher ses ancêtres et ses enfants directs</p>
  </header>

  <!-- VUE 1 : ACCUEIL / GALERIE -->
  <section id="home-view" class="view-section active">
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Rechercher une personne par son nom...">
    </div>
    <br>
    <div id="gallery-container" class="gallery-grid"></div>
  </section>

  <!-- VUE 2 : ARBRE D'UNE PERSONNE SÉLECTIONNÉE -->
  <section id="tree-view" class="view-section">
    <div class="nav-bar">
      <button class="btn-back" id="btn-back-home">← Retour à la liste complète</button>
      <h2 id="focused-title" style="color: var(--primary); font-size: 18px;"></h2>
    </div>

    <div class="tree-tree-wrapper">
      
      <!-- NIVEAU 1 : GRANDS-PARENTS DIRECTS -->
      <div class="tree-level" id="level-grandparents">
        <div class="tree-level-title">Grands-Parents Directs</div>
        <div class="tree-cards-group" id="group-grandparents"></div>
      </div>

      <!-- NIVEAU 2 : PARENTS DIRECTS -->
      <div class="tree-level" id="level-parents">
        <div class="tree-level-title">Parents Directs</div>
        <div class="tree-cards-group" id="group-parents"></div>
      </div>

      <!-- NIVEAU 3 : PERSONNE CIBLE ET CONJOINT -->
      <div class="tree-level" id="level-focus">
        <div class="tree-level-title">Personne Sélectionnée & Conjoint</div>
        <div class="tree-cards-group" id="group-focus"></div>
      </div>

      <!-- NIVEAU 4 : ENFANTS DIRECTS -->
      <div class="tree-level" id="level-children">
        <div class="tree-level-title">Enfants Directs</div>
        <div class="tree-cards-group" id="group-children"></div>
      </div>

    </div>
  </section>

  <!-- MODAL BIOGRAPHIE -->
  <div id="bio-modal" class="modal">
    <div class="modal-content">
      <span class="close-modal" id="close-modal-btn">&times;</span>
      <div class="avatar-container" style="width: 100px; height: 100px;">
        <img id="modal-photo" src="" alt="">
      </div>
      <h2 id="modal-name"></h2>
      <div class="modal-bio" id="modal-bio-text"></div>
    </div>
  </div>

  <script>
let familyData = { personnes: [] };
    const peopleMap = {}; // Dictionnaire global pour stocker les personnes par ID

    // Chargement dynamique du fichier JSON
    fetch("personnes.json")
      .then(response => {
        if (!response.ok) {
          throw new Error("Impossible de charger personnes.json");
        }
        return response.json();
      })
      .then(data => {
        familyData = data;
        familyData.personnes.forEach(p => {
          peopleMap[p.id] = p;
        });
      })
      .then(() => {
        // Afficher la galerie une fois les données prêtes
        renderGallery(); 
        })
      .catch(error => console.error("Erreur de chargement JSON:", error));

    // Normalisation des tableaux (enfants_ids / siblings)
    function toArray(val) {
      if (val === null || val === undefined) return [];
      return Array.isArray(val) ? val : [val];
    }

    // Avatar par défaut si pas d'image
    function getPhotoUrl(photo) {
      if (photo && photo !== "url_photo" && photo.trim() !== "") {
        return photo;
      }
      return "cat.jpeg";
    }

/**
* Récupère tous les ancêtres d'une personne (récursion infinie jusqu'aux racines)
* @param {string} personId - ID de la personne
* @param {number} currentDepth - Profondeur actuelle (interne)
* @param {Set} visited - IDs déjà traités pour éviter les boucles
* @returns {Array} Liste d'objets {person, depth, label}
*/
function getAncestors(personId, currentDepth = 0, visited = new Set()) {
  // Arrêt si ID invalide ou déjà traité
  if (!personId || visited.has(personId)) {
    return [];
  }
 
 visited.add(personId);
  const person = peopleMap[personId];
  if (!person) return [];
 
  let ancestors = [];
  let hasParent = false; // Vérifier s'il y a au moins un parent
 
  // Ajouter le père
  if (person.pere_id) {
    hasParent = true;
    const father = peopleMap[person.pere_id];
    if (father) {
      const label = getGenerationLabel(currentDepth, "Père");
      ancestors.push({ person: father, depth: currentDepth, label });
     
      // Récursion pour les ancêtres du père
      ancestors = ancestors.concat(
        getAncestors(person.pere_id, currentDepth + 1, visited)
      );
    }
  }
 
  // Ajouter la mère
  if (person.mere_id) {
    hasParent = true;
    const mother = peopleMap[person.mere_id];
    if (mother) {
      const label = getGenerationLabel(currentDepth, "Mère");
      ancestors.push({ person: mother, depth: currentDepth, label });
     
      // Récursion pour les ancêtres de la mère
      ancestors = ancestors.concat(
        getAncestors(person.mere_id, currentDepth + 1, visited)
      );
    }
  }
 
  // Si aucun parent trouvé, la chaîne s'arrête naturellement
  return ancestors;
}
 
/**
* Récupère tous les descendants d'une personne (récursion infinie jusqu'aux feuilles)
* @param {string} personId - ID de la personne
* @param {number} currentDepth - Profondeur actuelle (interne)
* @param {Set} visited - IDs déjà traités
* @returns {Array} Liste d'objets {person, depth, label}
*/
function getDescendants(personId, currentDepth = 0, visited = new Set()) {
  // Arrêt si ID invalide ou déjà traité
  if (!personId || visited.has(personId)) {
    return [];
  }
 
  visited.add(personId);
  const person = peopleMap[personId];
  if (!person) return [];
 
  let descendants = [];
  let hasChild = false; // Vérifier s'il y a au least un enfant
 
  // Récupérer les enfants directs
  const childrenIds = new Set(toArray(person.enfants_ids));
 
  // Ajouter aussi les personnes qui citent cette personne comme père/mère
  familyData.personnes.forEach(p => {
    if (p.pere_id === personId || p.mere_id === personId) {
      childrenIds.add(p.id);
    }
  });
 
  // Traiter chaque enfant
  childrenIds.forEach(childId => {
    const child = peopleMap[childId];
    if (child) {
      hasChild = true;
      const label = getGenerationLabel(currentDepth, "Enfant");
      descendants.push({ person: child, depth: currentDepth, label });
     
      // Récursion pour les descendants de l'enfant
      descendants = descendants.concat(
        getDescendants(childId, currentDepth + 1, visited)
      );
    }
  });
 
  // Si aucun enfant trouvé, la chaîne s'arrête naturellement
  return descendants;
}
 
/**
* Génère les labels de génération automatiquement
* @param {number} depth - Profondeur (0=direct, 1=+1 génération, etc.)
* @param {string} type - "Père", "Mère" ou "Enfant"
* @returns {string} Label formaté
*/
function getGenerationLabel(depth, type) {
  if (depth === 0) return type;
 
  // Construire le préfixe selon la profondeur
  let prefix = "";
  if (depth === 1) {
    prefix = "Arrière-";
  } else if (depth === 2) {
    prefix = "Arrière-Arrière-";
  } else if (depth === 3) {
    prefix = "Arrière-Arrière-Arrière-";
  } else {
    // Pour les profondeurs > 3, utiliser un format générique
    prefix = `${depth}x Arrière-`;
  }
 
  if (type === "Père") return prefix + "Grand-Père";
  if (type === "Mère") return prefix + "Grand-Mère";
  if (type === "Enfant") return prefix + "Petit-Enfant";
 
  return type;
}
 
/**
* Groupe les ancêtres/descendants par génération
* @param {Array} people - Résultat de getAncestors ou getDescendants
* @returns {Object} Objet {depth: [personnes]}
*/
function groupByDepth(people) {
  const grouped = {};
  people.forEach(item => {
    if (!grouped[item.depth]) {
      grouped[item.depth] = [];
    }
    grouped[item.depth].push(item);
  });
  return grouped;
}
 

    
    // Création d'une carte HTML pour une personne
    function createCard(person, relationBadge = "", isFocus = false) {
      const card = document.createElement('div');
      card.className = `person-card ${isFocus ? 'focus' : ''}`;
      
      const photoSrc = getPhotoUrl(person.photo);

      card.innerHTML = `
        ${relationBadge ? `<div class="badge-relation">${relationBadge}</div>` : ''}
        <div class="avatar-container">
          <img src="${photoSrc}" alt="${person.nom}">
        </div>
        <h3>${person.nom}</h3>
        <p>${person.bio || ''}</p>
      `;

      card.addEventListener('click', () => {
        showTreeForPerson(person.id);
      });

      return card;
    }

    // Affichage de la galerie sur la page d'accueil
    function renderGallery(filterText = "") {
      const gallery = document.getElementById('gallery-container');
      gallery.innerHTML = "";

      const filtered = familyData.personnes.filter(p => 
        p.nom.toLowerCase().includes(filterText.toLowerCase())
      );

      if (filtered.length === 0) {
        gallery.innerHTML = "<p style='grid-column: 1/-1; text-align:center;'>Aucune personne trouvée.</p>";
        return;
      }

      filtered.forEach(personne => {
        gallery.appendChild(createCard(personne));
      });
    }

    // Génération et affichage de l'arbre ciblé pour une personne
function showTreeForPerson(personId) {
  const target = peopleMap[personId];
  if (!target) return;
 
  // Basculer vers la vue Arbre
  document.getElementById('home-view').classList.remove('active');
  document.getElementById('tree-view').classList.add('active');
 
  document.getElementById('focused-title').textContent = `Arbre direct de : ${target.nom}`;
 
  // Conteneur principal
  const wrapper = document.querySelector('.tree-tree-wrapper');
  wrapper.innerHTML = ""; // Vider complètement
 
  // ===== ANCÊTRES (RÉCURSIF ILLIMITÉ) =====
  const ancestors = getAncestors(personId);
  const ancestorsByDepth = groupByDepth(ancestors);
 
  // Afficher du plus lointain au plus proche
  const maxAncestorDepth = Math.max(...Object.keys(ancestorsByDepth).map(Number), -1);
  for (let depth = maxAncestorDepth; depth >= 1; depth--) {
    if (ancestorsByDepth[depth] && ancestorsByDepth[depth].length > 0) {
      const levelDiv = createTreeLevel(
        `${getGenerationLabel(depth, "Père").split(" ")[0]} Ancêtres`,
        ancestorsByDepth[depth]
      );
      wrapper.appendChild(levelDiv);
    }
  }
 
  // ===== PARENTS DIRECTS =====
  const parents = [];
  if (target.pere_id && peopleMap[target.pere_id]) {
    parents.push({
      person: peopleMap[target.pere_id],
      depth: 0,
      label: "Père"
    });
  }
  if (target.mere_id && peopleMap[target.mere_id]) {
    parents.push({
      person: peopleMap[target.mere_id],
      depth: 0,
      label: "Mère"
    });
  }
 
  if (parents.length > 0) {
    const levelDiv = createTreeLevel("Parents Directs", parents);
    wrapper.appendChild(levelDiv);
  }
 
  // ===== PERSONNE SÉLECTIONNÉE ET CONJOINT =====
  const focusLevel = createTreeLevel(
    "Personne Sélectionnée",
    [{ person: target, depth: 0, label: "Sujet" }],
    true
  );
  if (target.conjoint && peopleMap[target.conjoint]) {
    const conjointCard = createCard(
      peopleMap[target.conjoint],
      "Conjoint(e)"
    );
    focusLevel.querySelector('.tree-cards-group').appendChild(conjointCard);
  }
  wrapper.appendChild(focusLevel);
 
  // ===== DESCENDANTS (RÉCURSIF ILLIMITÉ) =====
  const descendants = getDescendants(personId);
  const descendantsByDepth = groupByDepth(descendants);
 
  // Afficher du plus proche au plus lointain
  const maxDescendantDepth = Math.max(...Object.keys(descendantsByDepth).map(Number), 0);
  for (let depth = 1; depth <= maxDescendantDepth; depth++) {
    if (descendantsByDepth[depth] && descendantsByDepth[depth].length > 0) {
      const levelDiv = createTreeLevel(
        `${getGenerationLabel(depth, "Enfant").split(" ")[0]} Descendants`,
        descendantsByDepth[depth]
      );
      wrapper.appendChild(levelDiv);
    }
  }
 
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

    // Initialisation
    document.addEventListener('DOMContentLoaded', () => {
      renderGallery();

      // Événement recherche
      document.getElementById('search-input').addEventListener('input', (e) => {
        renderGallery(e.target.value);
      });

      // Bouton retour
      document.getElementById('btn-back-home').addEventListener('click', () => {
        document.getElementById('tree-view').classList.remove('active');
        document.getElementById('home-view').classList.add('active');
      });
    });
  </script>
</body>
</html>
