<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arbre Généalogique Familial</title>
  <style>
    :root {
      --primary: #2c3e50;
      --secondary: #3498db;
      --accent: #e74c3c;
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-main: #333333;
      --text-muted: #666666;
      --border-color: #e0e0e0;
      --highlight-bg: #ebf5fb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      color: var(--primary);
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-muted);
    }

    .search-bar {
      max-width: 400px;
      margin: 15px auto 0;
      display: flex;
    }

    .search-bar input {
      width: 100%;
      padding: 10px 15px;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      outline: none;
      font-size: 14px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1000px;
      margin: 0 auto 20px;
    }

    .btn-back {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .btn-back:hover {
      background-color: #1a252f;
    }

    .view-section {
      display: none;
      max-width: 1100px;
      margin: 0 auto;
    }

    .view-section.active {
      display: block;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      padding: 10px;
    }

    .person-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      position: relative;
    }

    .person-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 18px rgba(0,0,0,0.12);
      border-color: var(--secondary);
    }

    .person-card.focus {
      border-color: var(--secondary);
      background-color: var(--highlight-bg);
      box-shadow: 0 0 15px rgba(52, 152, 219, 0.3);
    }

    .avatar-container {
      width: 80px;
      height: 80px;
      margin: 0 auto 12px;
      border-radius: 50%;
      overflow: hidden;
      background-color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .avatar-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .person-card h3 {
      font-size: 15px;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .person-card p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .badge-relation {
      display: inline-block;
      font-size: 10px;
      text-transform: uppercase;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 10px;
      background: #e0e0e0;
      color: #555;
      margin-bottom: 6px;
    }

    .tree-tree-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 35px;
      position: relative;
    }

    .tree-level {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .tree-level-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      position: relative;
    }

    .tree-cards-group {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>

  <header>
    <h1>Arbre Généalogique Familial</h1>
    <p>Cliquez sur une personne pour afficher l'ensemble de sa lignée</p>
  </header>

  <section id="home-view" class="view-section active">
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Rechercher une personne par son nom...">
    </div>
    <br>
    <div id="gallery-container" class="gallery-grid"></div>
  </section>

  <section id="tree-view" class="view-section">
    <div class="nav-bar">
      <button class="btn-back" id="btn-back-home">← Retour à la liste complète</button>
      <h2 id="focused-title" style="color: var(--primary); font-size: 18px;"></h2>
    </div>
    <div class="tree-tree-wrapper"></div>
  </section>

  <script>
    let familyData = { personnes: [] };
    const peopleMap = {};

    fetch("personnes.json")
      .then(response => {
        if (!response.ok) throw new Error("Impossible de charger personnes.json");
        return response.json();
      })
      .then(data => {
        familyData = data;
        familyData.personnes.forEach(p => {
          peopleMap[Number(p.id)] = p;
        });
      })
      .then(() => { renderGallery(); })
      .catch(error => console.error("Erreur de chargement JSON:", error));

    // Convertit un nombre ou un tableau en tableau de nombres, mais préserve les nulls
    function toArray(val) {
      if (val === null || val === undefined || val === "null") return [];
      if (Array.isArray(val)) return val.map(Number);
      return [Number(val)];
    }

    function getPhotoUrl(photo) {
      if (photo && photo !== "url_photo" && photo.trim() !== "") return photo;
      return "cat.jpeg";
    }

    function createCard(person, relationBadge = "", isFocus = false) {
      const card = document.createElement('div');
      card.className = `person-card ${isFocus ? 'focus' : ''}`;
      
      card.innerHTML = `
        ${relationBadge ? `<div class="badge-relation">${relationBadge}</div>` : ''}
        <div class="avatar-container">
          <img src="${getPhotoUrl(person.photo)}" alt="${person.nom}">
        </div>
        <h3>${person.nom}</h3>
        <p>${person.bio || ''}</p>
      `;

      card.addEventListener('click', () => { showTreeForPerson(person.id); });
      return card;
    }

    function renderGallery(filterText = "") {
      const gallery = document.getElementById('gallery-container');
      gallery.innerHTML = "";

      const filtered = familyData.personnes.filter(p => 
        p.nom.toLowerCase().includes(filterText.toLowerCase())
      );

      if (filtered.length === 0) {
        gallery.innerHTML = "<p style='grid-column: 1/-1; text-align:center;'>Aucune personne trouvée.</p>";
        return;
      }

      filtered.forEach(personne => gallery.appendChild(createCard(personne)));
    }

    function getGenerationLabel(depth, isAncestor = true) {
      if (depth === 1) return isAncestor ? "Parents Directs" : "Enfants Directs";
      let prefix = "";
      for (let i = 0; i < (depth - 2); i++) prefix += "Arrière-";
      return isAncestor ? `${prefix}Grand-Parents` : `${prefix}Petits-Enfants`;
    }

    function collectAncestors(personId, depth = 1, map = {}, visited = new Set()) {
      const person = peopleMap[Number(personId)];
      if (!person || visited.has(Number(personId))) return;
      visited.add(Number(personId));

      const pereId = (person.pere_id !== null && person.pere_id !== "null" && person.pere_id !== "") ? Number(person.pere_id) : null;
      const mereId = (person.mere_id !== null && person.mere_id !== "null" && person.mere_id !== "") ? Number(person.mere_id) : null;

      const hasFather = pereId !== null && peopleMap[pereId];
      const hasMother = mereId !== null && peopleMap[mereId];

      if (!hasFather && !hasMother) return;

      if (!map[depth]) map[depth] = [];

      if (hasFather) {
        const father = peopleMap[pereId];
        if (!map[depth].some(item => item.person.id === father.id)) {
          map[depth].push({ person: father, label: `Père (${person.nom})` });
        }
        collectAncestors(father.id, depth + 1, map, visited);
      }

      if (hasMother) {
        const mother = peopleMap[mereId];
        if (!map[depth].some(item => item.person.id === mother.id)) {
          map[depth].push({ person: mother, label: `Mère (${person.nom})` });
        }
        collectAncestors(mother.id, depth + 1, map, visited);
      }
    }

    function collectDescendants(personId, depth = 1, map = {}, visited = new Set()) {
      const person = peopleMap[Number(personId)];
      if (!person || visited.has(Number(personId))) return;
      visited.add(Number(personId));

      const childrenIds = new Set(toArray(person.enfants_ids));
      familyData.personnes.forEach(p => {
        if (Number(p.pere_id) === Number(person.id) || Number(p.mere_id) === Number(person.id)) {
          childrenIds.add(Number(p.id));
        }
      });

      if (childrenIds.size === 0) return;

      if (!map[depth]) map[depth] = [];

      childrenIds.forEach(childId => {
        const child = peopleMap[childId];
        if (child) {
          if (!map[depth].some(item => item.person.id === child.id)) {
            map[depth].push({ person: child, label: `Enfant de ${person.nom}` });
          }
          collectDescendants(child.id, depth + 1, map, visited);
        }
      });
    }

    function showTreeForPerson(personId) {
      const target = peopleMap[Number(personId)];
      if (!target) return;

      document.getElementById('home-view').classList.remove('active');
      document.getElementById('tree-view').classList.add('active');
      document.getElementById('focused-title').textContent = `Lignée complète de : ${target.nom}`;

      const wrapper = document.querySelector('.tree-tree-wrapper');
      wrapper.innerHTML = "";

      // 1. Ancêtres
      const ancestorsMap = {};
      collectAncestors(target.id, 1, ancestorsMap, new Set());

      const ancestorDepths = Object.keys(ancestorsMap).map(Number).sort((a, b) => b - a);
      ancestorDepths.forEach(depth => {
        const levelDiv = document.createElement('div');
        levelDiv.className = 'tree-level';
        
        const titleDiv = document.createElement('div');
        titleDiv.className = 'tree-level-title';
        titleDiv.textContent = getGenerationLabel(depth, true);
        levelDiv.appendChild(titleDiv);

        const cardsGroup = document.createElement('div');
        cardsGroup.className = 'tree-cards-group';
        ancestorsMap[depth].forEach(item => cardsGroup.appendChild(createCard(item.person, item.label)));
        
        levelDiv.appendChild(cardsGroup);
        wrapper.appendChild(levelDiv);
      });

      // 2. Focus & Conjoint
      const focusLevel = document.createElement('div');
      focusLevel.className = 'tree-level';

      const focusTitle = document.createElement('div');
      focusTitle.className = 'tree-level-title';
      focusTitle.textContent = "Personne Sélectionnée & Conjoint";
      focusLevel.appendChild(focusTitle);

      const focusCardsGroup = document.createElement('div');
      focusCardsGroup.className = 'tree-cards-group';
      focusCardsGroup.appendChild(createCard(target, "Sujet", true));

      if (target.conjoint !== null && target.conjoint !== "null" && peopleMap[Number(target.conjoint)]) {
        focusCardsGroup.appendChild(createCard(peopleMap[Number(target.conjoint)], "Conjoint(e)"));
      }
      focusLevel.appendChild(focusCardsGroup);
      wrapper.appendChild(focusLevel);

      // 3. Descendants
      const descendantsMap = {};
      collectDescendants(target.id, 1, descendantsMap, new Set());

      const descendantDepths = Object.keys(descendantsMap).map(Number).sort((a, b) => a - b);
      descendantDepths.forEach(depth => {
        const levelDiv = document.createElement('div');
        levelDiv.className = 'tree-level';

        const titleDiv = document.createElement('div');
        titleDiv.className = 'tree-level-title';
        titleDiv.textContent = getGenerationLabel(depth, false);
        levelDiv.appendChild(titleDiv);

        const cardsGroup = document.createElement('div');
        cardsGroup.className = 'tree-cards-group';
        descendantsMap[depth].forEach(item => cardsGroup.appendChild(createCard(item.person, item.label)));

        levelDiv.appendChild(cardsGroup);
        wrapper.appendChild(levelDiv);
      });

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('search-input').addEventListener('input', (e) => {
        renderGallery(e.target.value);
      });

      document.getElementById('btn-back-home').addEventListener('click', () => {
        document.getElementById('tree-view').classList.remove('active');
        document.getElementById('home-view').classList.add('active');
      });
    });
  </script>
</body>
</html>
